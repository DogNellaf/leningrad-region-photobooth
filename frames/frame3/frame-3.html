<!DOCTYPE html>
<html>
	<head>
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
		<meta name="viewport" content="width=1366, maximum-scale=1.0">
		<style>
		@import url("https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css");
		@font-face {
			font-family: "Bebas Neue Cyrillic-Regular";
			font-style: normal;
			font-weight: 400;
			src: url('https://anima-uploads.s3.amazonaws.com/projects/657c508f265283a56c3eeec3/fonts/bebasneue-regular.otf') format("opentype");
		}
		
		.valign-text-middle {
			display: flex;
			flex-direction: column;
			justify-content: center;
		}
		
		:root {
			--black: #000000;
			--onahau: #ccffff;
			--purple-heart: #5b43e4;
			--font-size-l: 32px;
			--font-size-m: 20px;
			--font-size-xl: 40px;
			--font-family-bebas_neue_cyrillic-regular: "Bebas Neue Cyrillic-Regular", Helvetica;
		}
		
		.frame-3 {
			background-color: var(--purple-heart);
			height: 568px;
			overflow: hidden;
			overflow-x: hidden;
			position: relative;
		}
		
		.frame-3 .location {
			height: 390px;
			left: 555px;
			object-fit: cover;
			position: absolute;
			top: 58px;
			width: 694px;
		}
		
		.frame-3 .vector-2-Ix1nMc {
			height: 273px;
			left: 919px;
			position: absolute;
			top: 165px;
			width: 112px;
		}
		
		.frame-3 .person {
			height: 462px;
			left: 837px;
			object-fit: cover;
			position: absolute;
			top: 117px;
			width: 309px;
		}
		
		.frame-3 .background {
			height: 768px;
			left: 173px;
			position: absolute;
			width: 1143px;
			top: -90px;
		}
		
		.frame-3 .frame {
			height: 364px;
			left: 578px;
			position: absolute;
			top: 97px;
			width: 669px;
		}
		
		.frame-3 .button-back {
			background-color: var(--onahau);
			border-radius: 15px;
			height: 50px;
			left: 614px;
			position: absolute;
			top: 504px;
			width: 244px;
		}
		
		.frame-3 .button-index{
			background-color: var(--onahau);
			border-radius: 15px;
			height: 50px;
			left: 980px;
			position: absolute;
			top: 504px;
			width: 244px;
		}
		
		.frame-3 .qr {
			height: 210px;
			left: 139px;
			object-fit: cover;
			position: absolute;
			top: 167px;
			width: 210px;
		}
		
		.frame-3 .text-under-qr {
			color: #ffffff;
			height: 56px;
			left: 16px;
			top: 418px;
			width: 467px;
		}
		
		.frame-3 .title {
			height: 70px;
			right: 35px;
			position: absolute;
			top: 15px;
			width: 91px;
		}
		
		.frame-3 .button-text {
			font-color: var(--onahau);
			font-family: var(--font-family-bebas_neue_cyrillic-regular);
			font-size: var(--font-size-l);
			font-weight: 700;
			line-height: 60px;
			text-align: center;
		}
		
		.frame-3 .text_label {
			font-family: var(--font-family-bebas_neue_cyrillic-regular);
			font-size: var(--font-size-l);
			font-weight: 500;
			line-height: 40px;
			position: absolute;
			text-align: center;
		}
		</style>
	</head>
	<body style="margin: 0;background: #5b43e4;">
		<div class="container-center-horizontal">
			<div class="frame-3 screen ">
				<img class="location" src="result/location.png">
				
				<img class="vector-2-Ix1nMc" src="result/vector-2-1.svg">
				
				<img class="person" src="result/person.png">
				<img class="background" src="result/background.svg">
				<img class="frame" src="result/frame.svg">
				<a href="">
					<div class="button-back">
						<h1 class="button-text">
							НАЗАД
						</h1>
					</div>
				</a>
				<a href="">
					<div class="button-index">
						<h1 class="button-text">
							В НАЧАЛО
						</h1>
					</div>
				</a>
				<p class="text-under-qr valign-text-middle text_label">Наведите камеру своего телефона
				<br>и скачайте фото</p>
				<img class="qr" src="result/qr.png">
				<img class="title" src="result/title.png">
			</div>
		</div>
	</body>
</html>
