        .screen textarea:focus,
        .screen input:focus {
          outline: none;
        }
        
        .screen * {

          box-sizing: border-box;
        }
        
        .screen div {
          -webkit-text-size-adjust: none;
        }
        
        .component-wrapper a {
          display: contents;
          pointer-events: auto;
          text-decoration: none;
        }
        
        .component-wrapper * {
          -webkit-font-smoothing: antialiased;
          box-sizing: border-box;
          pointer-events: none;
        }
        
        .component-wrapper a *,
        .component-wrapper input,
        .component-wrapper video,
        .component-wrapper iframe {
          pointer-events: auto;
        }
        
        .component-wrapper.not-ready,
        .component-wrapper.not-ready * {
          visibility: hidden !important;
        }
        
        .screen a {
          display: contents;
          text-decoration: none;
        }
        
        .full-width-a {
          width: 100%;
        }
        
        .full-height-a {
          height: 100%;
        }
        
        .container-center-vertical {
          align-items: center;
          display: flex;
          flex-direction: row;
          height: 100%;
          pointer-events: none;
        }
        
        .container-center-vertical > * {
          flex-shrink: 0;
          pointer-events: auto;
        }
        
        .container-center-horizontal {
          display: flex;
          flex-direction: row;
          justify-content: center;
          pointer-events: none;
          width: 100%;
        }
        
        .container-center-horizontal > * {
          flex-shrink: 0;
          pointer-events: auto;
        }
        
        .auto-animated div {
          --z-index: -1;
          opacity: 0;
          position: absolute;
        }
        
        .auto-animated input {
          --z-index: -1;
          opacity: 0;
          position: absolute;
        }
        
        .auto-animated .container-center-vertical,
        .auto-animated .container-center-horizontal {
          opacity: 1;
        }
        
        .overlay-base {
          display: none;
          height: 100%;
          opacity: 0;
          position: fixed;
          top: 0;
          width: 100%;
        }
        
        .overlay-base.animate-appear {
          align-items: center;
          animation: reveal 0.3s ease-in-out 1 normal forwards;
          display: flex;
          flex-direction: column;
          justify-content: center;
          opacity: 0;
        }
        
        .overlay-base.animate-disappear {
          animation: reveal 0.3s ease-in-out 1 reverse forwards;
          display: block;
          opacity: 1;
          pointer-events: none;
        }
        
        .overlay-base.animate-disappear * {
          pointer-events: none;
        }
        
        @keyframes reveal {
          from { opacity: 0 }
         to { opacity: 1 }
        }
        
        .animate-nodelay {
          animation-delay: 0s;
        }
        
        .align-self-flex-start {
          align-self: flex-start;
        }
        
        .align-self-flex-end {
          align-self: flex-end;
        }
        
        .align-self-flex-center {
          align-self: flex-center;
        }
        
        .valign-text-middle {
          display: flex;
          flex-direction: column;
          justify-content: center;
        }
        
        .valign-text-bottom {
          display: flex;
          flex-direction: column;
          justify-content: flex-end;
        }
        
        input:focus {
          outline: none;
        }
        
        .listeners-active,
        .listeners-active * {
          pointer-events: auto;
        }
        
        .hidden,
        .hidden * {
          pointer-events: none;
          visibility: hidden;
        }
        
        .smart-layers-pointers,
        .smart-layers-pointers * {
          pointer-events: auto;
          visibility: visible;
        }
        
        .listeners-active-click,
        .listeners-active-click * {
          cursor: pointer;
        }
        
        * {

<body style="margin: 0;background: #5b43e4;">
    <div class="container-center-horizontal">
        <div class="frame-2 screen ">
			<img id="photo" />
			<video id="webcam" autoplay playsinline style="width: 100%; height: 768px;"></video>
			<canvas id="canvas" class="d-none"></canvas>
			<script>
				const webcamElement = document.getElementById('webcam');
				const canvasElement = document.getElementById('canvas');
				const webcam = new Webcam(webcamElement, 'user', canvasElement);
				webcam.start()
				.then(result =>{
				  console.log("webcam started");
				})
				.catch(err => {
				   console.log(err);
				})	;
				
				function snap() {
					let picture = webcam.snap();
					document.querySelector('#photo').src = picture;
					alert("ICE!!");
				}
			</script>
