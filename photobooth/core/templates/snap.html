{% extends "base.html" %}
{% load static %}

{% block content %}
<script crossorigin type="text/javascript" src="{% static 'snap/webcam-easy.min.js' %}"></script>
          <div class="snap screen ">
            <img id="photo"/>
            <video id="webcam" height="672px" width="985px" autoplay playsinline></video>
            <canvas hidden id="canvas" class="d-none"></canvas>

            <img class="background" src="{% static 'snap/background.png' %}">
            <img class="frame" src="{% static 'snap/frame.svg' %}">
            <div hidden id="button-resnap" onclick="resnap()">
              <h1 class="button-text">ПЕРЕСНЯТЬ</h1>
            </div>
            <div id="button-snap" onclick="snap()">
              <h1 class="button-text">СДЕЛАТЬ ФОТО</h1>
            </div>
            <a href="{% url 'location' %}">
              <div hidden id="button-next">
                <h1 class="button-text">ДАЛЕЕ</h1>
              </div>
            </a>
            <img class="title vector" src="{% static 'title.png' %}">
          </div>
      </div>

      <script>
        const webcamElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('canvas');
        const webcam = new Webcam(webcamElement, 'user', canvasElement);
        let picture = null;
        is_hidden = false;
        webcam.start()
        .then(result =>{
          console.log("webcam started");
        })
        .catch(err => {
          console.log(err);
        })	;
        
        function snap() {
          if (!is_hidden) {
            picture = webcam.snap();
            document.querySelector('#photo').setAttribute("src", picture);
            document.querySelector('#button-snap').setAttribute("hidden", "hidden");
            webcamElement.setAttribute("hidden", "hidden");
            document.querySelector('#button-resnap').removeAttribute("hidden");
            document.querySelector('#button-next').removeAttribute("hidden");
            is_hidden = true;
          }
        }

        function resnap() {
          document.querySelector('#photo').removeAttribute("src");
          document.querySelector('#button-snap').removeAttribute("hidden");
          webcamElement.removeAttribute("hidden");
          is_hidden = false;
          document.querySelector('#button-resnap').setAttribute("hidden", "hidden");
          document.querySelector('#button-next').setAttribute("hidden", "hidden");
        }
      </script>
      {% endblock content %}
